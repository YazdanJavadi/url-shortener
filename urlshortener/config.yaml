# Default configuration for urlshort.
# Override any value with env vars: URLSHORT_<SECTION>_<KEY>
# e.g. URLSHORT_DB_PASSWORD=secret

server:
  port: 8080
  base_url: "http://localhost:8080"

db:
  driver: postgres
  host: localhost
  port: 5432
  user: urlshort
  password: urlshort
  name: urlshort
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime_seconds: 300

url:
  code_length: 6

cache:
  enabled: true
  address: "localhost:6379"
  ttl_seconds: 3600

tracing:
  enabled: true
  service_name: urlshort
  otlp_endpoint: "localhost:4318"
  insecure: true

log:
  level: info
  format: json
